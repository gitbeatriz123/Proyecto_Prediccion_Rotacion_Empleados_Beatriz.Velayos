name: CI

on:
  push:
    branches: [main, portfolio-final]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ML dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-ml.txt
      - name: Run tests
        run: python -m pytest -q
