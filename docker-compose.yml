services:
  postgres:
    image: postgres:15
    container_name: postgres-rotacion
    environment:
      POSTGRES_USER: ml
      # Credencial local de PostgreSQL para las conexiones del entorno.
      POSTGRES_PASSWORD: ml
      POSTGRES_DB: mlops
    ports:
      - "127.0.0.1:5442:5432"
    volumes:
      - ./postgres:/var/lib/postgresql/data
    restart: unless-stopped

  spark-master:
    image: bitnami/spark:3.5
    container_name: spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    ports:
      - "127.0.0.1:7077:7077"   # Spark master RPC, solo local
      - "127.0.0.1:8080:8080"   # Spark master UI, solo local
    restart: unless-stopped

  jupyter:
    build:
      context: .
      dockerfile: docker/jupyter.Dockerfile
    container_name: jupyter-rotacion
    ports:
      - "127.0.0.1:8889:8888"   # http://localhost:8889, solo local
    volumes:
      - ./scripts:/scripts
      - ./data:/data
      - ./output:/output
      - ./notebooks:/home/jovyan/work
      - ./docs/powerbi:/docs/powerbi
    depends_on:
      - postgres
      - spark-master
    restart: unless-stopped
